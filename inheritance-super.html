Puppy extends Dog", "after": " {\n}", "hint": "final on a class blocks any further subclassing."}, {"lvl": 3, "prompt": "Declare a constructor that forwards multiple arguments to the parent via super.", "before": "class Vehicle {\n    Vehicle(String make, int year) { }\n}\n\nclass Car extends Vehicle {\n    Car(String make, int year) {\n        ", "blank": "super(make, year)", "after": ";\n    }\n}", "hint": "super(args) forwards as many arguments as the parent constructor expects."}, {"lvl": 3, "prompt": "Reference the parent class's field explicitly when the subclass has a field of the same name.", "before": "class Animal {\n    String type = \"animal\";\n}\n\nclass Dog extends Animal {\n    String type = \"dog\";\n\n    void printBoth() {\n        System.out.println(", "blank": "super.type", "after": " + \" \" + type);\n    }\n}", "hint": "super.fieldName accesses the parent's shadowed field."}]
