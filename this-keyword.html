<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The this keyword — java.quest</title>
<meta name="description" content="A typing arcade game for practicing the this keyword in Java." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/game.css">
</head>
<body>
<div class="stage">

  <div class="titlebar">
    <div class="logo">java<span>.</span>quest</div>
    <a class="back-link" href="../index.html">&larr; all topics</a>
    <div class="tagline">// The this keyword</div>
  </div>

  <div class="hud">
    <div class="hud-group">
      <div>
        <div class="stat-label">Lives</div>
        <div class="lives" id="lives"></div>
      </div>
      <div>
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div>
        <div class="stat-label">Streak</div>
        <div class="stat-value"><span class="streak-flame">&#9679;</span> <span id="streak">0</span></div>
      </div>
    </div>
    <div>
      <div class="stat-label" style="text-align:right;">Best</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="game-area">
    <div class="timer-track" id="timer-track"><div class="timer-fill" id="timer-fill"></div></div>

    <div class="editor" id="editor">
      <div class="editor-bar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
        <div class="filename" id="filename">Main.java</div>
        <div class="level-pill" id="level-pill">Level 1</div>
      </div>
      <div class="prompt" id="prompt"></div>
      <pre class="code" id="code"></pre>
      <div class="input-row">
        <span class="caret">&gt;</span>
        <input id="answer" type="text" placeholder="type the missing code" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="btn-row">
      <button class="primary" id="submit-btn">Run &#9654;</button>
      <button id="hint-btn">Hint</button>
      <button class="ghost" id="skip-btn">Skip</button>
    </div>

    <div class="console" id="console"></div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Build failed</h2>
    <div class="big" id="overlay-score">0</div>
    <p id="overlay-sub">final score</p>
    <button class="primary" id="restart-btn">Play again</button>
  </div>

</div>

<script>
window.TOPIC = {
  slug: "this-keyword",
  title: "The this keyword",
  fileBase: "Main",
  bank: [{"lvl": 1, "prompt": "Assign the constructor parameter to the instance field.", "before": "class Student {\n    String name;\n\n    Student(String name) {\n        ", "blank": "this", "after": ".name = name;\n    }\n}", "hint": "Refers to the current object."}, {"lvl": 1, "prompt": "Fix the setter \u2014 field and parameter share the same name.", "before": "class Person {\n    int age;\n\n    void setAge(int age) {\n        ", "blank": "this", "after": ".age = age;\n    }\n}", "hint": "Same fix as a constructor with a shadowed field."}, {"lvl": 1, "prompt": "Refer to the current object's balance field.", "before": "class Account {\n    double balance;\n\n    void deposit(double balance) {\n        ", "blank": "this", "after": ".balance += balance;\n    }\n}", "hint": "One keyword disambiguates field from parameter."}, {"lvl": 1, "prompt": "Set the current object's color field from the parameter.", "before": "class Car {\n    String color;\n\n    Car(String color) {\n        ", "blank": "this", "after": ".color = color;\n    }\n}", "hint": "It always refers to the object the method runs on."}, {"lvl": 1, "prompt": "Assign the id field using the current object reference.", "before": "class Ticket {\n    int id;\n\n    Ticket(int id) {\n        ", "blank": "this", "after": ".id = id;\n    }\n}", "hint": "Four letters, lowercase."}, {"lvl": 2, "prompt": "Call the current object's own save method from within reset.", "before": "class Doc {\n    void save() { /* ... */ }\n\n    void reset() {\n        ", "blank": "this.save", "after": "();\n    }\n}", "hint": "You can call another method on the current object explicitly."}, {"lvl": 2, "prompt": "Return the current object so setName can be chained.", "before": "class Builder {\n    String name;\n\n    Builder setName(String n) {\n        this.name = n;\n        return ", "blank": "this", "after": ";\n    }\n}", "hint": "Method chaining returns a reference to the object itself."}, {"lvl": 2, "prompt": "Pass the current object into the logger.", "before": "class Order {\n    void place() {\n        Logger.log(", "blank": "this", "after": ");\n    }\n}", "hint": "An object can hand a reference to itself to another method."}, {"lvl": 2, "prompt": "Read the current object's width field inside area().", "before": "class Rect {\n    int width, height;\n\n    int area() {\n        return ", "blank": "this.width", "after": " * this.height;\n    }\n}", "hint": "Explicitly qualify width the same way height is qualified."}, {"lvl": 2, "prompt": "Compare the parameter object's id to this object's id.", "before": "class Item {\n    int id;\n\n    boolean sameAs(Item other) {\n        return ", "blank": "this.id", "after": " == other.id;\n    }\n}", "hint": "You're qualifying id on the current object, mirroring other.id."}, {"lvl": 3, "prompt": "Call the two-argument constructor with default coordinates.", "before": "class Point {\n    int x, y;\n\n    Point() {\n        ", "blank": "this(0, 0)", "after": ";\n    }\n\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}", "hint": "Constructor chaining calls this(...) with matching arguments."}, {"lvl": 3, "prompt": "Chain to the three-argument constructor, defaulting the discount to zero.", "before": "class Invoice {\n    double amount, tax, discount;\n\n    Invoice(double amount, double tax) {\n        ", "blank": "this(amount, tax, 0)", "after": ";\n    }\n\n    Invoice(double amount, double tax, double discount) {\n        this.amount = amount;\n        this.tax = tax;\n        this.discount = discount;\n    }\n}", "hint": "Pass through the two real parameters and supply the missing one."}, {"lvl": 3, "prompt": "Return the current object after updating stock.", "before": "class Inventory {\n    int stock;\n\n    Inventory restock(int n) {\n        this.stock += n;\n        return ", "blank": "this", "after": ";\n    }\n}", "hint": "Same fluent-return pattern, just applied to a different field."}, {"lvl": 3, "prompt": "Pass the current object to register it with a shared manager.", "before": "class Worker {\n    Worker() {\n        Pool.register(", "blank": "this", "after": ");\n    }\n}", "hint": "An object registering itself passes a reference to itself."}, {"lvl": 3, "prompt": "Call the single-argument constructor from the no-argument one.", "before": "class Config {\n    String mode;\n\n    Config() {\n        ", "blank": "this(\"default\")", "after": ";\n    }\n\n    Config(String mode) {\n        this.mode = mode;\n    }\n}", "hint": "Constructor chaining with a string literal argument."}]
};
</script>
<script src="../assets/game.js"></script>
</body>
</html>
