<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arrays — java.quest</title>
<meta name="description" content="A typing arcade game for practicing arrays in Java." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/game.css">
</head>
<body>
<div class="stage">

  <div class="titlebar">
    <div class="logo">java<span>.</span>quest</div>
    <a class="back-link" href="../index.html">&larr; all topics</a>
    <div class="tagline">// Arrays</div>
  </div>

  <div class="hud">
    <div class="hud-group">
      <div>
        <div class="stat-label">Lives</div>
        <div class="lives" id="lives"></div>
      </div>
      <div>
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div>
        <div class="stat-label">Streak</div>
        <div class="stat-value"><span class="streak-flame">&#9679;</span> <span id="streak">0</span></div>
      </div>
    </div>
    <div>
      <div class="stat-label" style="text-align:right;">Best</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="game-area">
    <div class="timer-track" id="timer-track"><div class="timer-fill" id="timer-fill"></div></div>

    <div class="editor" id="editor">
      <div class="editor-bar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
        <div class="filename" id="filename">Main.java</div>
        <div class="level-pill" id="level-pill">Level 1</div>
      </div>
      <div class="prompt" id="prompt"></div>
      <pre class="code" id="code"></pre>
      <div class="input-row">
        <span class="caret">&gt;</span>
        <input id="answer" type="text" placeholder="type the missing code" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="btn-row">
      <button class="primary" id="submit-btn">Run &#9654;</button>
      <button id="hint-btn">Hint</button>
      <button class="ghost" id="skip-btn">Skip</button>
    </div>

    <div class="console" id="console"></div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Build failed</h2>
    <div class="big" id="overlay-score">0</div>
    <p id="overlay-sub">final score</p>
    <button class="primary" id="restart-btn">Play again</button>
  </div>

</div>

<script>
window.TOPIC = {
  slug: "arrays",
  title: "Arrays",
  fileBase: "Main",
  bank: [{"lvl": 1, "prompt": "Declare an int array of size 5.", "before": "", "blank": "int[] nums = new int[5]", "after": ";", "hint": "type[] name = new type[size];"}, {"lvl": 1, "prompt": "Get the length of the nums array.", "before": "int size = nums", "blank": ".length", "after": ";", "hint": "Arrays expose a length field, not a method."}, {"lvl": 1, "prompt": "Access the third element (index 2) of nums.", "before": "int third = nums", "blank": "[2]", "after": ";", "hint": "Square brackets with a zero-based index."}, {"lvl": 2, "prompt": "Declare and initialize an int array with three literal values.", "before": "", "blank": "int[] nums = {1, 2, 3}", "after": ";", "hint": "Curly braces list the initial values directly."}, {"lvl": 2, "prompt": "Loop over arr using the enhanced for loop.", "before": "", "blank": "for (int n : arr)", "after": " {\n    sum += n;\n}", "hint": "for (type item : array)"}, {"lvl": 2, "prompt": "Sort the array in place using the standard library.", "before": "", "blank": "Arrays.sort(nums)", "after": ";", "hint": "A static method on java.util.Arrays."}, {"lvl": 3, "prompt": "Declare a 2D array representing a 3x3 grid.", "before": "", "blank": "int[][] grid = new int[3][3]", "after": ";", "hint": "Two sets of brackets for a 2D array."}, {"lvl": 3, "prompt": "Copy the first three elements of source into a new array.", "before": "int[] copy = ", "blank": "Arrays.copyOf(source, 3)", "after": ";", "hint": "A static Arrays method that takes the source array and desired length."}, {"lvl": 3, "prompt": "Access the element at row 1, column 2 of a 2D grid.", "before": "int value = grid", "blank": "[1][2]", "after": ";", "hint": "Two bracket pairs, one per dimension."}]
};
</script>
<script src="../assets/game.js"></script>
</body>
</html>
