<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loops — java.quest</title>
<meta name="description" content="A typing arcade game for practicing loops in Java." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/game.css">
</head>
<body>
<div class="stage">

  <div class="titlebar">
    <div class="logo">java<span>.</span>quest</div>
    <a class="back-link" href="../index.html">&larr; all topics</a>
    <div class="tagline">// Loops</div>
  </div>

  <div class="hud">
    <div class="hud-group">
      <div>
        <div class="stat-label">Lives</div>
        <div class="lives" id="lives"></div>
      </div>
      <div>
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div>
        <div class="stat-label">Streak</div>
        <div class="stat-value"><span class="streak-flame">&#9679;</span> <span id="streak">0</span></div>
      </div>
    </div>
    <div>
      <div class="stat-label" style="text-align:right;">Best</div>
      <div class="stat-value" id="best">0</div>
    </div>
  </div>

  <div id="game-area">
    <div class="timer-track" id="timer-track"><div class="timer-fill" id="timer-fill"></div></div>

    <div class="editor" id="editor">
      <div class="editor-bar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
        <div class="filename" id="filename">Main.java</div>
        <div class="level-pill" id="level-pill">Level 1</div>
      </div>
      <div class="prompt" id="prompt"></div>
      <pre class="code" id="code"></pre>
      <div class="input-row">
        <span class="caret">&gt;</span>
        <input id="answer" type="text" placeholder="type the missing code" autocomplete="off" spellcheck="false" />
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="btn-row">
      <button class="primary" id="submit-btn">Run &#9654;</button>
      <button id="hint-btn">Hint</button>
      <button class="ghost" id="skip-btn">Skip</button>
    </div>

    <div class="console" id="console"></div>
  </div>

  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Build failed</h2>
    <div class="big" id="overlay-score">0</div>
    <p id="overlay-sub">final score</p>
    <button class="primary" id="restart-btn">Play again</button>
  </div>

</div>

<script>
window.TOPIC = {
  slug: "loops",
  title: "Loops",
  fileBase: "Main",
  bank: [{"lvl": 1, "prompt": "Complete the increment part of the for loop header.", "before": "for (int i = 0; i < 10; ", "blank": "i++", "after": ") {\n    System.out.println(i);\n}", "hint": "The third clause of a for loop usually increments the counter."}, {"lvl": 1, "prompt": "Write the condition that keeps a while loop running while count is under 5.", "before": "while (", "blank": "count < 5", "after": ") {\n    count++;\n}", "hint": "A boolean expression goes inside while's parentheses."}, {"lvl": 1, "prompt": "Complete the initialization clause of the for loop, starting i at 1.", "before": "for (", "blank": "int i = 1", "after": "; i <= 10; i++) {\n    total += i;\n}", "hint": "The first clause declares and initializes the loop variable."}, {"lvl": 2, "prompt": "Write the enhanced for-loop header to iterate over the names array.", "before": "", "blank": "for (String name : names)", "after": " {\n    System.out.println(name);\n}", "hint": "for (type item : collection)"}, {"lvl": 2, "prompt": "Skip the rest of this iteration when n is even.", "before": "for (int n : numbers) {\n    if (n % 2 == 0) {\n        ", "blank": "continue", "after": ";\n    }\n    process(n);\n}", "hint": "One keyword jumps to the next loop iteration."}, {"lvl": 2, "prompt": "Exit the loop entirely once the target is found.", "before": "for (int i = 0; i < arr.length; i++) {\n    if (arr[i] == target) {\n        ", "blank": "break", "after": ";\n    }\n}", "hint": "One keyword exits the nearest loop immediately."}, {"lvl": 3, "prompt": "Write a complete do-while loop that prints i while it's less than 3, checking the condition after the body.", "before": "int i = 0;\n", "blank": "do {\n    System.out.println(i);\n    i++;\n} while (i < 3)", "after": ";", "hint": "do { ... } while (condition); \u2014 note the trailing semicolon."}, {"lvl": 3, "prompt": "Label the outer loop so break can target it specifically from the inner loop.", "before": "", "blank": "outer:", "after": "\nfor (int i = 0; i < 3; i++) {\n    for (int j = 0; j < 3; j++) {\n        if (j == 1) break outer;\n    }\n}", "hint": "A loop label is just a name followed by a colon."}, {"lvl": 3, "prompt": "Complete the nested for-loop header to iterate columns inside a fixed row.", "before": "for (int row = 0; row < 3; row++) {\n    ", "blank": "for (int col = 0; col < 3; col++)", "after": " {\n        System.out.print(grid[row][col]);\n    }\n}", "hint": "Same shape as the outer for loop, using a different counter name."}]
};
</script>
<script src="../assets/game.js"></script>
</body>
</html>
