<script>
window.TOPIC = {
  slug: "encapsulation",
  title: "Encapsulation & access modifiers",
  fileBase: "Main",
  bank: [{"lvl": 1, "prompt": "Make the balance field inaccessible from outside the class.", "before": "class Account {\n    ", "blank": "private double balance", "after": ";\n}", "hint": "The most restrictive access modifier."}, {"lvl": 1, "prompt": "Declare a public getter for the private name field.", "before": "class Person {\n    private String name;\n\n    ", "blank": "public String getName()", "after": " {\n        return name;\n    }\n}", "hint": "Getter convention: public, returns the field's type, named getFieldName."}, {"lvl": 1, "prompt": "Declare a public setter for the private name field.", "before": "class Person {\n    private String name;\n\n    ", "blank": "public void setName(String name)", "after": " {\n        this.name = name;\n    }\n}", "hint": "Setter convention: public void setFieldName(type param)."}, {"lvl": 2, "prompt": "Validate input inside the setter before assigning it.", "before": "class Account {\n    private double balance;\n\n    public void setBalance(double balance) {\n        if (balance < 0) {\n            ", "blank": "return", "after": ";\n        }\n        this.balance = balance;\n    }\n}", "hint": "Exiting early from a void method just needs the bare keyword."}, {"lvl": 2, "prompt": "Make a field visible to subclasses and the same package, but not everywhere.", "before": "class Animal {\n    ", "blank": "protected int age", "after": ";\n}", "hint": "More open than private, more restrictive than public."}, {"lvl": 2, "prompt": "Declare a class-level constant that's safe to expose publicly since it can't change.", "before": "class Config {\n    ", "blank": "public static final int MAX_USERS = 100", "after": ";\n}", "hint": "public is safe here because static final prevents mutation."}, {"lvl": 3, "prompt": "Return a defensive copy instead of the live array, to preserve encapsulation.", "before": "class Roster {\n    private String[] names;\n\n    public String[] getNames() {\n        return ", "blank": "names.clone()", "after": ";\n    }\n}", "hint": "Returning the original array would let callers mutate private state."}, {"lvl": 3, "prompt": "Use package-private (no modifier) access for a helper method meant only for classes in the same package.", "before": "class Repository {\n    ", "blank": "void internalRefresh()", "after": " {\n    }\n}", "hint": "Omitting the access modifier entirely gives package-private visibility."}, {"lvl": 3, "prompt": "Declare a getter that computes a derived value rather than exposing a raw field.", "before": "class Rectangle {\n    private int width, height;\n\n    public int getArea() {\n        ", "blank": "return width * height", "after": ";\n    }\n}", "hint": "Getters don't have to return a stored field directly."}]
